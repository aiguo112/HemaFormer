# Conda environment for HemaFormer.
#
#   conda env create -f environment.yml
#   conda activate hemaformer
#
# The CUDA wheel index below targets CUDA 12.x drivers. For a CPU-only install
# drop the `--extra-index-url` line and the `+cu124` suffixes, or use
# requirements.txt with a torch build that matches your machine.
name: hemaformer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.4
      - torchvision>=0.19
      - timm>=1.0
      - numpy>=1.26
      - pandas>=2.1
      - pillow>=10.0
      - scikit-learn>=1.3
      - matplotlib>=3.8
      - tqdm>=4.66
      - transformers>=4.40
